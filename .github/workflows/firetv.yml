name: BuddyFlix Fire TV APK

on:
  push:
    branches: [develop]
    paths:
      - 'clients/firetv/**'
      - '.github/workflows/firetv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buddyflix-firetv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[firetv]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Fire TV debug APK
        run: gradle -p clients/firetv :app:assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist/firetv
          cp clients/firetv/app/build/outputs/apk/debug/app-debug.apk \
            "dist/firetv/BuddyFlix-FireTV-0.1.0-dev.${GITHUB_RUN_NUMBER}.apk"
          sha256sum dist/firetv/*.apk > dist/firetv/SHA256SUMS.txt

      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: BuddyFlix-FireTV-0.1.0-dev.${{ github.run_number }}
          path: dist/firetv/
          retention-days: 2
