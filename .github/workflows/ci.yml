name: BuddyFlix CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test
        run: go test ./...

      - name: Build linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o buddyflix-amd64 ./cmd/buddyflix

      - name: Build linux ARMHF
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o buddyflix-armhf ./cmd/buddyflix

      - name: Upload ARMHF test payload
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: buddyflix-develop-armhf
          path: |
            buddyflix-armhf
            web/
          retention-days: 14
