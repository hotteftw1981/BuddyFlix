name: BuddyFlix CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buddyflix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Define build versions
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            echo "app_version=0.1.1-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "qpkg_version=0.1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=0.1.1-dev" >> "$GITHUB_OUTPUT"
            echo "qpkg_version=0.1.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: go test ./...

      - name: Check frontend JavaScript
        run: node --check web/app.js

      - name: Check BuddyFlix metadata project credential
        env:
          BUDDYFLIX_TVDB_API_KEY: ${{ secrets.BUDDYFLIX_TVDB_API_KEY }}
        shell: bash
        run: |
          if [ -n "${BUDDYFLIX_TVDB_API_KEY:-}" ]; then
            echo "BuddyFlix metadata project credential: embedded"
          else
            echo "BuddyFlix metadata project credential: missing"
          fi

      - name: Build linux amd64
        env:
          BUDDYFLIX_TVDB_API_KEY: ${{ secrets.BUDDYFLIX_TVDB_API_KEY }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X buddyflix/internal/app.Version=$APP_VERSION"
          if [ -n "${BUDDYFLIX_TVDB_API_KEY:-}" ]; then
            LDFLAGS="$LDFLAGS -X buddyflix/internal/app.BuiltinTVDBAPIKey=$BUDDYFLIX_TVDB_API_KEY"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o buddyflix-amd64 ./cmd/buddyflix

      - name: Build linux ARMHF
        env:
          BUDDYFLIX_TVDB_API_KEY: ${{ secrets.BUDDYFLIX_TVDB_API_KEY }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X buddyflix/internal/app.Version=$APP_VERSION"
          if [ -n "${BUDDYFLIX_TVDB_API_KEY:-}" ]; then
            LDFLAGS="$LDFLAGS -X buddyflix/internal/app.BuiltinTVDBAPIKey=$BUDDYFLIX_TVDB_API_KEY"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="$LDFLAGS" -o buddyflix-armhf ./cmd/buddyflix

      - name: Install QDK 2.3.11
        if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.3.11 https://github.com/qnap-dev/QDK.git /tmp/QDK
          cd /tmp/QDK
          sudo bash ./InstallToUbuntu.sh install

      - name: Build QNAP ARMHF dev QPKG
        if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch'
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          QPKG_VERSION: ${{ steps.version.outputs.qpkg_version }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/buddyflix-qpkg"
          mkdir -p "$ROOT/shared"
          sed "s/__VERSION__/$QPKG_VERSION/g" packaging/qnap/qpkg.cfg.in > "$ROOT/qpkg.cfg"
          cp packaging/qnap/package_routines "$ROOT/package_routines"
          cp -R packaging/qnap/icons "$ROOT/icons"
          cp packaging/qnap/BuddyFlix.sh "$ROOT/shared/BuddyFlix.sh"
          chmod +x "$ROOT/shared/BuddyFlix.sh"
          cp buddyflix-armhf "$ROOT/shared/buddyflix"
          chmod +x "$ROOT/shared/buddyflix"
          cp -R web "$ROOT/shared/web"
          printf 'BuddyFlix %s development build\nQPKG version: %s\nWeb UI: http://NAS-IP:8096\n' "$APP_VERSION" "$QPKG_VERSION" > "$ROOT/shared/README-QNAP.txt"
          cd "$ROOT"
          /usr/share/QDK/bin/qbuild
          FOUND="$(find build -maxdepth 1 -type f -name '*.qpkg' | head -n 1)"
          test -n "$FOUND"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          OUT="$GITHUB_WORKSPACE/dist/BuddyFlix_${APP_VERSION}_TS431P2_ARMHF.qpkg"
          cp "$FOUND" "$OUT"
          cd "$GITHUB_WORKSPACE"
          python3 packaging/qnap/fix_qpkg_tail.py "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload QNAP dev QPKG
        if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BuddyFlix-${{ steps.version.outputs.app_version }}-QNAP-ARMHF
          path: |
            dist/*.qpkg
            dist/*.sha256
          retention-days: 7
